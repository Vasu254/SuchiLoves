<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suchitha</title>
    <meta name="description" content="Suchitha love page" />
    <style>
      :root {
        --bg1: #1d1027;
        --bg2: #2d1438;
        --pink: #ff5fa2;
        --rose: #ff7ca8;
        --gold: #ffd8a8;
        --white: #fff7fb;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, var(--bg2), var(--bg1) 60%);
        color: var(--white);
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      .scene {
        position: relative;
        width: min(92vw, 900px);
        padding: 48px 28px;
        text-align: center;
        border-radius: 28px;
        background: rgba(255,255,255,0.08);
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.42);
        border: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(6px);
      }

      .sparkle,
      .sparkle::before,
      .sparkle::after {
        position: absolute;
        content: "";
        width: 12px;
        height: 12px;
        background: radial-gradient(circle, #fff 0%, #ffd4e7 35%, transparent 70%);
        border-radius: 50%;
        opacity: 0.9;
        animation: twinkle 2.2s ease-in-out infinite alternate;
      }

      .sparkle:nth-child(1) { left: 10%; top: 18%; }
      .sparkle:nth-child(2) { right: 12%; top: 22%; animation-delay: 0.7s; }
      .sparkle:nth-child(3) { left: 18%; bottom: 18%; animation-delay: 1.4s; }
      .sparkle:nth-child(4) { right: 20%; bottom: 12%; animation-delay: 1.1s; }

      .badge {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(255, 125, 170, 0.18);
        border: 1px solid rgba(255,255,255,0.2);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 12px;
        color: #ffeaf5;
      }

      h1 {
        margin: 24px 0 16px;
        font-size: clamp(2.5rem, 6vw, 6rem);
        line-height: 1;
        color: #fff;
      }

      .heart {
        font-size: clamp(2rem, 4vw, 4rem);
        display: inline-block;
        color: var(--pink);
        text-shadow: 0 0 20px rgba(255, 95, 162, 0.9);
        animation: pulse 1.4s ease-in-out infinite;
      }

      p {
        margin: 16px auto 0;
        max-width: 620px;
        font-size: clamp(1rem, 2vw, 1.35rem);
        color: #f7e8f1;
        line-height: 1.7;
      }

      .cta {
        margin-top: 22px;
        display: inline-block;
        padding: 13px 24px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--pink), var(--rose));
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        box-shadow: 0 20px 40px rgba(255, 95, 162, 0.4);
      }

      .floating {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .floating span {
        position: absolute;
        color: rgba(255,255,255,0.7);
        font-size: 22px;
        animation: floatUp 7s linear infinite;
      }

      .floating span:nth-child(1) { left: 12%; top: 58%; }
      .floating span:nth-child(2) { left: 70%; top: 28%; animation-delay: 1.6s; }
      .floating span:nth-child(3) { left: 32%; top: 18%; animation-delay: 2.8s; }
      .floating span:nth-child(4) { left: 85%; top: 68%; animation-delay: 0.8s; }
      .floating span:nth-child(5) { left: 52%; top: 75%; animation-delay: 3.5s; }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }

      @keyframes twinkle {
        0% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(1.8); opacity: 1; }
      }

      @keyframes floatUp {
        0% { transform: translateY(25px) scale(0.8); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateY(-60px) scale(1.2); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="sparkle"></div>
      <div class="sparkle"></div>
      <div class="sparkle"></div>
      <div class="sparkle"></div>

      <div class="badge">Forever &amp; Always</div>
      <h1>Suchitha <span class="heart">❤</span></h1>
      <p>
        A little universe made with love, joy, and endless memories.<br />
        May every day feel like the beginning of a beautiful story.
      </p>
      <a class="cta" href="mailto:hello@suchitha.com">hello@suchitha.com</a>
    </div>

    <div class="floating" aria-hidden="true">
      <span>♥</span>
      <span>♡</span>
      <span>❤</span>
      <span>✦</span>
      <span>♥</span>
    </div>
  </body>
</html>
